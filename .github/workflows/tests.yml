name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries (Qt, ExifTool)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
                                  libimage-exiftool-perl

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,plots]"

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: CLI smoke test (synthetic T540 recording)
        run: |
          python convert_csq.py --demo /tmp/demo.csq --output /tmp/out
          python examples/read_hdf5.py /tmp/out/demo_temperature.h5
          python convert_csq.py --verify /tmp/out/demo_temperature.h5

      - name: Server wrapper smoke test (batch, headless)
        run: |
          mkdir -p /tmp/srv/input/sub
          python convert_csq.py --demo /tmp/srv/input/rec_a.csq --output /tmp/srv/unused >/dev/null
          python convert_csq.py --demo /tmp/srv/input/sub/rec_b.csq --output /tmp/srv/unused >/dev/null
          bash -n run_server.sh && bash -n run_slurm.sbatch && bash -n scripts/install_server.sh
          FLIR_PYTHON="$(command -v python)" ./run_server.sh /tmp/srv/input /tmp/srv/output
          test -f /tmp/srv/output/rec_a_temperature.h5
          test -f /tmp/srv/output/sub/rec_b_temperature.h5
          test -f /tmp/srv/output/batch_summary.json
          python - <<'PY'
          import json, pathlib
          s = json.loads(pathlib.Path("/tmp/srv/output/batch_summary.json").read_text())
          assert s["totals"]["converted"] == 2, s
          print("batch ok:", s["totals"])
          PY
